<div class="todo-list">
  <mat-card>  
    <mat-card-header>
      <mat-card-title>{{ todos()?.[0]?.date | date:'mediumDate' }}</mat-card-title>
    </mat-card-header>      
    <mat-card-content>    
      <mat-list>
        @if ((todos() ?? []).length !== 0)
        {
          @for (todo of todos(); track todo.id)
          {
            <mat-list-item>
              <app-todo [todo]="todo" (toggle)="toggleTodoCompletion(todo)" (delete)="deleteTodo(todo.id)"></app-todo>
            </mat-list-item>
          }
        }       
      </mat-list>
    </mat-card-content>
  </mat-card>
</div>
