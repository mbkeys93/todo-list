<div class="todo-item">
  <mat-checkbox [checked]="todo().completed" (change)="onToggle()">
    <span [class.completed]="todo().completed">{{ todo().description }}</span>
  </mat-checkbox>
  <button mat-icon-button color="warn" (click)="onDelete()">
    <mat-icon>delete</mat-icon>
  </button>
</div>
